<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#171717"/>
<rect width="900" height="48" fill="#7f1d1d"/>
<text x="24" y="31" fill="#ffffff" font-family="monospace" font-size="20" font-weight="bold">ILLUSTRATIVE OUTPUT - NOT EXECUTED</text>
<text x="24" y="84" fill="#d4d4d4" font-family="monospace" font-size="18">$ syncdeadlock</text>
<text x="24" y="116" fill="#f1f1f1" font-family="monospace" font-size="17">P0 requests R0</text>
<text x="24" y="144" fill="#f1f1f1" font-family="monospace" font-size="17">P0 granted R0 and requests R1</text>
<text x="24" y="172" fill="#b5cea8" font-family="monospace" font-size="17">P0 starts work with R0 and R1</text>
<text x="24" y="200" fill="#b5cea8" font-family="monospace" font-size="17">P0 releases R0 and R1</text>
<text x="24" y="232" fill="#f1f1f1" font-family="monospace" font-size="17">P1 requests R1 ...</text>
<text x="24" y="260" fill="#f1f1f1" font-family="monospace" font-size="17">P2 requests R0 ...</text>
<text x="24" y="312" fill="#9cdcfe" font-family="monospace" font-size="17">All 5 processes completed all work cycles</text>
<text x="24" y="344" fill="#9cdcfe" font-family="monospace" font-size="17">Strategy: every process acquires resources in increasing order</text>
</svg>
